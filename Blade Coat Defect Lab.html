<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blade Coat Defect Lab</title>
<meta name="description" content="Coating-flow workbench for slurry metering under a coating blade: 2D CFD of the gap, meniscus and film, plus thin-film models of the contact line, web edge and film levelling, with live model-validity checks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f4fd8'/%3E%3Ccircle cx='8' cy='8.7' r='4.6' fill='none' stroke='white' stroke-width='1.4'/%3E%3Cpath d='M8 8.7 6.3 6.2M8 5.4v1M10.8 8.7h-1M5.2 8.7h1' stroke='white' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* Minimal pre-paint styling so the page doesn't flash unstyled before styles.css loads. */
  :root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; padding: 0; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; background: #e9edf2; color: #141821; }
  img { max-width: 100%; }
  [hidden]:not([hidden=until-found i]) { display: none !important; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="tb-brand">
      <span class="tb-logo" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2 12.5h12" stroke="currentColor" stroke-width="1.5"/><path d="M3 12.5c2.5-.2 4-1.6 5.2-4.4L10 3.5h3.5l-2.6 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
      <h1 class="brand">Blade Coat Defect Lab</h1>
    </div>
    <details class="vp-pop tb-file" id="fileMenu"><summary class="tb-menu">File</summary>
      <div class="pop-body pop-menu" role="menu" aria-label="File">
        <button class="menu-item" type="button" id="fmNew" role="menuitem">New project<kbd data-key="file.new"></kbd></button>
        <button class="menu-item" type="button" id="fmOpen" role="menuitem">Open…<kbd data-key="file.open">Ctrl+O</kbd></button>
        <button class="menu-item" type="button" id="fmSave" role="menuitem">Save<kbd data-key="file.save">Ctrl+S</kbd></button>
        <button class="menu-item" type="button" id="fmSaveAs" role="menuitem">Save as…<kbd data-key="file.saveAs">Ctrl+Shift+S</kbd></button>
        <div class="menu-sep menu-sep-plain" aria-hidden="true"></div>
        <button class="menu-item" type="button" id="fmImport" role="menuitem">Import measured data…<kbd data-key="file.import"></kbd></button>
        <button class="menu-item" type="button" id="fmReport" role="menuitem">Report…<kbd data-key="file.report"></kbd></button>
        <div class="menu-sep" id="fmRecentSep" hidden><span>Recent projects</span></div>
        <div id="fmRecent"></div>
      </div>
    </details>
    <details class="vp-pop tb-file" id="editMenu"><summary class="tb-menu">Edit</summary>
      <div class="pop-body pop-menu" role="menu" aria-label="Edit">
        <button class="menu-item" type="button" id="emUndo" role="menuitem" disabled><span class="mi-l">Undo</span><kbd data-key="edit.undo">Ctrl+Z</kbd></button>
        <button class="menu-item" type="button" id="emRedo" role="menuitem" disabled><span class="mi-l">Redo</span><kbd data-key="edit.redo">Ctrl+Y</kbd></button>
        <div class="menu-sep"><span>This view</span></div>
        <button class="menu-item" type="button" id="emHistory" role="menuitem">History</button>
      </div>
    </details>
    <details class="vp-pop tb-file" id="helpMenu"><summary class="tb-menu">Help</summary>
      <div class="pop-body pop-menu" role="menu" aria-label="Help">
        <button class="menu-item" type="button" role="menuitem" id="hmWelcome">Welcome…</button>
        <button class="menu-item" type="button" role="menuitem" data-help-sec="guide">Module guide<kbd data-key="help.open"></kbd></button>
        <button class="menu-item" type="button" role="menuitem" data-help-sec="methods">Methods and limits</button>
        <button class="menu-item" type="button" role="menuitem" data-help-sec="keys">Keyboard shortcuts<kbd data-key="help.keys"></kbd></button>
        <button class="menu-item" type="button" role="menuitem" data-help-sec="search">Search help…</button>
      </div>
    </details>
    <span class="tb-grow" aria-hidden="true"></span>
    <span class="tb-proj" id="projName">Untitled</span>
    <span class="tb-vsep" aria-hidden="true"></span>
    <div class="tb-undo">
      <button id="undoBtn" class="icon-btn tb-icon" type="button" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5 2.5 6.5l3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.8 6.5h6.7a3.5 3.5 0 0 1 0 7H6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button id="redoBtn" class="icon-btn tb-icon" type="button" aria-label="Redo (Ctrl+Y)" title="Redo (Ctrl+Y)" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3.5l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.2 6.5H6.5a3.5 3.5 0 0 0 0 7h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <span class="tb-vsep" aria-hidden="true"></span>
    <div class="tb-actions">
      <button id="imgBtn" class="icon-btn tb-icon" type="button" aria-label="Save as image (PNG or SVG)" title="Save as image (PNG or SVG)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5h2.2l1.1-1.7h4.4l1.1 1.7h2.2v7h-11z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8.9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn tb-icon" type="button" aria-label="Switch light / dark theme" title="Switch light / dark theme">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.8a5.2 5.2 0 0 1 0 10.4z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <nav class="tabbar" aria-label="Sections">
    <div class="modules" role="tablist" aria-label="Sections" id="tabs"></div>
    <span class="tb-grow" aria-hidden="true"></span>
    <button id="inputsBtn" class="inputs-btn" type="button" aria-pressed="true" aria-controls="treeScroll" title="Show or hide the inputs (Ctrl+B)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="5.5" cy="4.5" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.3"/><circle cx="10.5" cy="8" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.3"/><circle cx="6.5" cy="11.5" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.3"/></svg><span>Inputs</span>
    </button>
  </nav>

  <div class="wb-body" id="wbBody">
    <aside class="tree" aria-label="Inputs">
      <div class="tree-head">
        <button id="treeToggle" class="icon-btn tree-toggle" type="button" aria-label="Hide the inputs" title="Hide the inputs" aria-expanded="true" aria-controls="treeScroll">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="tree-title">Inputs</span>
        <button id="reset" class="tree-reset" type="button" title="Reset the shared inputs to their defaults (the CFD setup stays; Undo takes it back)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 6.2A5 5 0 1 1 3 9.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M2.6 2.8v3.6h3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Reset</span>
        </button>
      </div>
      <nav class="tree-rail" id="treeRail" aria-label="Input groups"></nav>
      <div class="tree-scroll" id="treeScroll">
        <p class="tree-note-top" id="treeNote"></p>
        <div id="params"></div>
        <div id="setupExtra"></div>
      </div>
    </aside>
    <div class="split split-v" id="treeSplit" role="separator" aria-orientation="vertical" aria-label="Resize the model panel" tabindex="0"></div>
    <main class="work" id="work">
      <div id="view"></div>
    </main>
  </div>

  <footer class="statusbar" aria-label="Status">
    <div class="sb-item sb-prog" id="sbProg" hidden></div>
    <p class="scope sb-item" id="scope" role="status" aria-live="polite"></p>
    <div class="sb-item sb-coord" id="sbCoord" aria-live="off"></div>
    <div class="sb-item sb-cfd" id="cfdStatus" aria-label="CFD runs"></div>
  </footer>
</div>

<script src="physics.js"></script>
<script src="draw.js"></script>
<script src="simulation.js"></script>
<script src="cfd-flowviz.js"></script>
<script src="cfd-plot.js"></script>
<script src="workers-src.js"></script>
<script src="icons.js"></script>
<script src="cfd-progress.js"></script>
<script src="cfd-ui.js"></script>
<script src="cfd-steps.js"></script>
<script src="cfd-3d-geom.js"></script>
<script src="cfd-3d-stream.js"></script>
<script src="ui-3d.js"></script>
<script src="doe.js"></script>
<script src="export-image.js"></script>
<script src="validate.js"></script>
<script src="help.js"></script>
<script src="project.js"></script>
<script src="undo.js"></script>
<script src="report.js"></script>
<script src="measured.js"></script>
<script src="keys.js"></script>
<script src="guide.js"></script>
<script src="tree.js"></script>
<script src="welcome.js"></script>
<script src="ui-1d.js"></script>
<script src="ui.js"></script>
</body>
</html>
